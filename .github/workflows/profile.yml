name: Génération du profil

on:
  schedule:
    - cron: "17 3 * * *"   # chaque nuit vers 4h17 (heure de Paris)
  push:
    branches: [main]
    paths: ["config.json", "scripts/**", ".github/workflows/profile.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Générer les SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate.py

      - name: Commit si changement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || git commit -m "chore: mise à jour du profil"
          git push
